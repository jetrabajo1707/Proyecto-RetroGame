<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Game - Coleccionables</title>

    <!-- Hojas de estilo globales (usamos ../ porque estamos en la carpeta paginas/) -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <!-- CABECERA GLOBAL: Inyectada dinámicamente por js/components.js -->
    <div id="header-placeholder"></div>

    <!-- CONTENIDO PRINCIPAL DE COLECCIONABLES -->
    <main>

        <!-- BANNER DE COLECCIONABLES -->
        <section class="banner">
            <!-- REEMPLAZAR IMAGEN: Coloca tu banner en imagenes/banners/banner-coleccionables.png (Dimensiones recomendadas: 1200x365px) -->
            <img src="../imagenes/banners/banner-coleccionables.png" alt="Colecciona tus historias favoritas - Figuras, cartuchos y más">
        </section>

        <!-- SECCIÓN DE COLECCIONABLES DESTACADOS -->
        <section aria-labelledby="titulo-coleccionables">
            <h2 id="titulo-coleccionables" class="section-title">Coleccionables Destacados</h2>

            <div class="contenedor-productos">

                <!-- Producto 1: Figuras -->
                <article class="card">
                    <!-- REEMPLAZAR IMAGEN: Coloca tu imagen en imagenes/coleccionables/figura.png (Dimensiones recomendadas: 300x190px) -->
                    <img src="../imagenes/coleccionables/figura.png" alt="Figuras coleccionables retro">
                    <h3>Figuras</h3>
                    <p class="price">S/. 120</p>
                    <a href="./contacto.html" class="btn-card">Ver Más</a>
                </article>

                <!-- Producto 2: Cartuchos -->
                <article class="card">
                    <!-- REEMPLAZAR IMAGEN: Coloca tu imagen en imagenes/coleccionables/cartucho.png (Dimensiones recomendadas: 300x190px) -->
                    <img src="../imagenes/coleccionables/cartucho.png" alt="Cartuchos clásicos originales">
                    <h3>Cartuchos</h3>
                    <p class="price">S/. 85</p>
                    <a href="./contacto.html" class="btn-card">Ver Más</a>
                </article>

                <!-- Producto 3: Ediciones Especiales -->
                <article class="card">
                    <!-- REEMPLAZAR IMAGEN: Coloca tu imagen en imagenes/coleccionables/ediciones-especiales.png (Dimensiones recomendadas: 300x190px) -->
                    <img src="../imagenes/coleccionables/ediciones-especiales.png" alt="Ediciones especiales de colección">
                    <h3>Ediciones Especiales</h3>
                    <p class="price">S/. 250</p>
                    <a href="./contacto.html" class="btn-card">Ver Más</a>
                </article>

                <!-- Producto 4: Merchandising -->
                <article class="card">
                    <!-- REEMPLAZAR IMAGEN: Coloca tu imagen en imagenes/coleccionables/merchandising.png (Dimensiones recomendadas: 300x190px) -->
                    <img src="../imagenes/coleccionables/merchandising.png" alt="Merchandising clásico de videojuegos">
                    <h3>Merchandising</h3>
                    <p class="price">S/. 65</p>
                    <a href="./contacto.html" class="btn-card">Ver Más</a>
                </article>

            </div>
        </section>

    </main>

    <!-- PIE DE PÁGINA GLOBAL: Inyectado dinámicamente por js/components.js -->
    <div id="footer-placeholder"></div>

    <!-- Script principal global -->
    <script type="module" src="../js/main.js"></script>

</body>
</html>
