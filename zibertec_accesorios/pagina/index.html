<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Game - Accesorios</title>

    <!-- Vinculación de estilos externos -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- CABECERA Y NAVEGACIÓN -->
    <header>
        <div class="logo">
            <a href="#">
                <img src="../imagenes/logo.png" alt="Logo Retro Game">
            </a>
        </div>

        <nav>
            <a href="#">Inicio</a>
            <a href="#">Consolas</a>
            <a href="#">VideoJuegos</a>
            <a href="#" class="activo">Accesorios</a>
            <a href="#">Coleccionables</a>
            <a href="#">Servicios</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <!-- BANNER PRINCIPAL -->
    <section class="banner">
        <img src="../imagenes/banner-accesorios.png" alt="Accesorios para tus consolas">
    </section>

    <!-- TARJETAS DE PRODUCTOS -->
    <main>
        <div class="contenedor-productos">

            <article class="card">
                <img src="../imagenes/control.png" alt="Controles para videojuegos">
                <h3>Controles</h3>
                <p>S/. 45</p>
                <a href="#">Ver Más</a>
            </article>

            <article class="card">
                <img src="../imagenes/cables.png" alt="Cables de conexión">
                <h3>Cables</h3>
                <p>S/. 35</p>
                <a href="#">Ver Más</a>
            </article>

            <article class="card">
                <img src="../imagenes/memorias.png" alt="Memorias de almacenamiento">
                <h3>Memorias</h3>
                <p>S/. 60</p>
                <a href="#">Ver Más</a>
            </article>

            <article class="card">
                <img src="../imagenes/adaptadores.png" alt="Adaptadores retro">
                <h3>Adaptadores</h3>
                <p>S/. 50</p>
                <a href="#">Ver Más</a>
            </article>

        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <div class="columna-footer">
            <h4>Información</h4>
            <p>Sobre nosotros</p>
            <p>Términos y condiciones</p>
        </div>

        <div class="columna-footer">
            <h4>Soporte</h4>
            <p>Centro de ayuda</p>
            <p>Garantías</p>
        </div>

        <div class="columna-footer redes-columna">
            <h4>Síguenos</h4>

            <div class="redes">
                <img src="../iconos/instagram.png" alt="Instagram">
                <img src="../iconos/facebook.png" alt="Facebook">
                <img src="../iconos/whatsapp.png" alt="WhatsApp">
            </div>
        </div>
    </footer>

</body>
</html>
